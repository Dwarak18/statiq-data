name: PR Security & Verification Check

on:
  pull_request:
    branches: [ main, master, dev ]
  push:
    branches: [ main, master, dev ]

jobs:
  security-check:
    name: Security & Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Security & PR Verification Check
        run: bash scripts/security_check.sh --pr
