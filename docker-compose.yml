services:
  postgres:
    image: postgres:16-alpine
    container_name: statiqone-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-statiquser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-statiqpass_secure_2026}
      POSTGRES_DB: ${DB_NAME:-statiqdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./authsystem/backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-statiquser} -d ${DB_NAME:-statiqdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - statiqone-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statiqone-backend
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${DB_USER:-statiquser}:${DB_PASSWORD:-statiqpass_secure_2026}@postgres:5432/${DB_NAME:-statiqdb}
      - APP_ORIGIN=http://localhost:3000
      - COOKIE_DOMAIN=localhost
      - SESSION_SECRET=${SESSION_SECRET:-statiqone-session-secret-production-2026}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-af63bf307be0c3020580febb9f3d102ede5ab311f3bfe57f37c1c9f78d4521090a8d99bfc384a0e21e504b2b0fb4fe407dccb6d259ab33e85d5aa95b84702d9d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-6e91df552dbabc6a207b0655ca5de0b1dbe8c2c6cc4f6174d2bf280ff12757c1a6b9360d04b7e9fb96f3d2104c207a56828b2f229992448602b7fd466da6143c}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-a0877a88d97bf5b20cd9191e6aa681b89b0ea930db08c59bb472594a81036bcb}
      - PII_HMAC_KEY=${PII_HMAC_KEY:-81c1007d5cd5fdf2f009a147f1fc9ab70ba17f0c493b479b36fe4bdc33940061}
    env_file:
      - ./authsystem/backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - statiqone-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: statiqone-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - statiqone-net

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: statiqone-test
    profiles:
      - test

volumes:
  pgdata:
    driver: local

networks:
  statiqone-net:
    driver: bridge
