# ==============================================================================
# STATIQONE Production Nginx Configuration
# Domain: www.statiqone.com / statiqone.com
# Reverse Proxy: Node.js Express Backend (Port 4000)
# Static Frontend: Vite Build (/var/www/statiqone/dist)
# ==============================================================================

# HTTP Server - Redirect all HTTP traffic to HTTPS (with ACME challenge support)
server {
    listen 80;
    listen [::]:80;
    server_name statiqone.com www.statiqone.com;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS www.statiqone.com
    location / {
        return 301 https://www.statiqone.com$request_uri;
    }
}

# HTTPS Server - Redirect apex domain (statiqone.com) to www (www.statiqone.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name statiqone.com;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/statiqone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statiqone.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://www.statiqone.com$request_uri;
}

# Main HTTPS Server (www.statiqone.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.statiqone.com;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/statiqone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statiqone.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security & Protection Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Static Frontend Root Directory
    root /var/www/statiqone/dist;
    index index.html;

    # Service Worker & PWA Manifest - Never cache aggressively
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires 0;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Static Assets Long-term Immutable Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Express Backend Reverse Proxy (Port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts and Buffers
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
